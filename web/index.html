<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doc-Helper</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --line: #e3e6ea;
      --text: #1f2430;
      --muted: #6b7280;
      --primary: #2f6fed;
      --primary-dark: #255cc8;
      --green: #16a34a;
      --red: #dc2626;
      --amber: #b45309;
      --radius: 10px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      background: var(--card);
      border-bottom: 1px solid var(--line);
    }
    header .brand { font-size: 18px; font-weight: 700; }
    header .brand small { color: var(--muted); font-weight: 400; margin-left: 8px; }
    .btn {
      border: 1px solid var(--line);
      background: var(--card);
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text);
    }
    .btn:hover { background: #f0f2f5; }
    .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .btn.primary:hover { background: var(--primary-dark); }
    .btn.danger { color: var(--red); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .container { max-width: 900px; margin: 24px auto; padding: 0 20px; }
    .hidden { display: none !important; }

    /* 工具列表 */
    .tool-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px 18px;
      margin-bottom: 14px;
    }
    .tool-card.draft { opacity: .72; }
    .tool-card-head { display: flex; align-items: center; gap: 10px; }
    .tool-name { font-weight: 700; font-size: 15px; }
    .badge { font-size: 11px; padding: 2px 8px; border-radius: 20px; }
    .badge.on { background: #e7f6ec; color: var(--green); }
    .badge.off { background: #fef3e2; color: var(--amber); }
    .tool-desc { color: var(--muted); font-size: 13px; margin: 8px 0 12px; line-height: 1.6; }
    .tool-card-actions { display: flex; gap: 8px; }
    .empty { color: var(--muted); text-align: center; padding: 60px 0; }

    /* 调用页 */
    .back { margin-bottom: 16px; }
    .call-title { font-size: 20px; font-weight: 700; }
    .call-desc { color: var(--muted); font-size: 13px; margin: 6px 0 18px; }
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 14px;
    }
    .param { margin-bottom: 16px; }
    .param label { font-weight: 600; font-size: 13px; }
    .param .req { color: var(--red); }
    .param .hint { color: var(--muted); font-size: 12px; margin: 2px 0 6px; }
    .drop-zone {
      border: 2px dashed var(--line);
      border-radius: var(--radius);
      padding: 24px 16px;
      text-align: center;
      cursor: pointer;
      color: var(--muted);
      transition: border-color .15s, background .15s;
      margin-bottom: 16px;
    }
    .drop-zone:hover { border-color: var(--primary); }
    .drop-zone.drag-over { border-color: var(--primary); background: #eef4ff; }
    .drop-hint { font-size: 13px; }
    .drop-hint strong { color: var(--primary); }
    .drop-count { font-size: 12px; color: var(--primary); margin-top: 6px; }
    .drop-error { font-size: 12px; color: var(--red); margin-top: 6px; }
    .drop-list { margin-top: 12px; text-align: left; }
    .drop-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 10px; margin-bottom: 6px;
      background: #f7f8fa; border: 1px solid var(--line); border-radius: 8px;
      font-size: 13px; color: var(--text);
    }
    .drop-item .fname { word-break: break-all; }
    .drop-item .frm { color: var(--red); cursor: pointer; margin-left: 10px; border: none; background: none; font-size: 15px; line-height: 1; }
    .text-input, .file-input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 13px;
    }
    .file-names { color: var(--primary); font-size: 12px; margin-top: 4px; }
    .actions { display: flex; gap: 8px; align-items: center; }
    #run-progress { color: var(--primary); font-size: 13px; margin-top: 10px; }
    .result-ok { color: var(--green); font-weight: 600; margin-bottom: 8px; }
    .result-err { color: var(--red); font-weight: 600; }
    .result-links { display: flex; gap: 10px; flex-wrap: wrap; }
    .download {
      display: inline-block;
      background: #eef4ff;
      color: var(--primary);
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
    }
    .download:hover { background: #dfeaff; }

    /* 设置弹窗 */
    .modal-mask {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.4);
      display: flex; align-items: center; justify-content: center;
      z-index: 10;
    }
    .modal {
      background: var(--card);
      border-radius: 12px;
      padding: 22px;
      width: 440px;
      max-width: 92vw;
    }
    .modal h3 { margin: 0 0 16px; }
    .modal .field { margin-bottom: 12px; }
    .modal .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .modal .text-input { width: 100%; }
    .modal .actions { justify-content: flex-end; margin-top: 16px; }

    /* 聊天侧边栏 */
    .chat-panel {
      position: fixed;
      top: 0; right: 0; bottom: 0;
      width: 380px;
      background: var(--card);
      border-left: 1px solid var(--line);
      display: flex; flex-direction: column;
      z-index: 20;
      transition: transform .2s ease;
      box-shadow: -4px 0 12px rgba(0,0,0,.06);
    }
    .chat-panel.closed { transform: translateX(100%); }
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .chat-toggle { z-index: 21; }
    .chat-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      font-weight: 700; font-size: 15px;
    }
    .chat-header .sub { color: var(--muted); font-weight: 400; font-size: 12px; }
    .chat-messages {
      flex: 1; overflow-y: auto;
      padding: 14px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .chat-msg {
      max-width: 88%;
      padding: 9px 12px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap; word-break: break-word;
    }
    .chat-msg.user { align-self: flex-end; background: var(--primary); color: #fff; }
    .chat-msg.assistant { align-self: flex-start; background: #f1f3f6; color: var(--text); }
    .chat-tool {
      margin-top: 6px; padding: 6px 10px;
      background: #eef4ff; border-radius: 8px;
      font-size: 12px; color: var(--primary);
    }
    .chat-tool.err { background: #fdeeee; color: var(--red); }
    .chat-draft {
      margin-top: 8px; padding: 10px 12px;
      border: 1px dashed var(--primary); border-radius: 10px;
      background: #f5f9ff;
    }
    .chat-draft-title { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .chat-draft-name { font-weight: 700; font-size: 14px; }
    .chat-draft-desc { font-size: 12px; color: var(--muted); margin: 4px 0 8px; }
    .chat-input {
      display: flex; gap: 8px; align-items: flex-end;
      padding: 12px;
      border-top: 1px solid var(--line);
    }
    .chat-input textarea {
      flex: 1; resize: none;
      border: 1px solid var(--line); border-radius: 8px;
      padding: 8px 10px; font-size: 13px; font-family: inherit;
      min-height: 40px; max-height: 120px;
    }
    .chat-empty { color: var(--muted); font-size: 12px; text-align: center; margin-top: 40px; line-height: 1.8; }
  </style>
</head>
<body>
  <header>
    <div class="brand">Doc-Helper <small>本地文档处理助手</small></div>
    <div class="header-actions">
      <button id="chat-toggle" class="btn">💬 智能体</button>
      <button id="settings-btn" class="btn">设置</button>
    </div>
  </header>

  <div class="container">
    <!-- 主界面：工具列表 -->
    <div id="main-view">
      <h2 style="margin:0 0 16px;">工具列表</h2>
      <div id="tool-list"></div>
      <h2 style="margin:24px 0 16px;">插件</h2>
      <div id="plugin-list"></div>
    </div>

    <!-- 工具调用界面 -->
    <div id="call-view" class="hidden">
      <button id="call-back" class="btn back">← 返回</button>
      <div class="call-title" id="call-title"></div>
      <div class="call-desc" id="call-desc"></div>
      <div class="panel">
        <div id="param-fields"></div>
        <div class="actions">
          <button id="run-btn" class="btn primary" disabled>开始运行</button>
          <button id="cancel-btn" class="btn danger hidden">取消</button>
        </div>
      </div>
      <div id="run-progress" class="hidden"></div>
      <div id="run-result" class="panel hidden"></div>
    </div>
  </div>

  <!-- 设置弹窗 -->
  <div id="settings-modal" class="modal-mask hidden">
    <div class="modal">
      <h3>大模型设置</h3>
      <div class="field"><label>厂商</label><input id="set-vendor" class="text-input" placeholder="deepseek"></div>
      <div class="field"><label>Base URL</label><input id="set-base" class="text-input" placeholder="https://api.deepseek.com"></div>
      <div class="field"><label>模型名</label><input id="set-model" class="text-input" placeholder="deepseek-chat"></div>
      <div class="field"><label>API Key</label><input id="set-key" class="text-input" type="password" placeholder="sk-...">
        <div id="set-key-hint" class="hint" style="color:var(--muted);font-size:12px;margin-top:4px;"></div>
      </div>
      <div class="actions">
        <button id="settings-close" class="btn">取消</button>
        <button id="settings-save" class="btn primary">保存</button>
      </div>
    </div>
  </div>

  <!-- 聊天侧边栏 -->
  <div id="chat-panel" class="chat-panel">
    <div class="chat-header">
      <span>智能体助手 <span class="sub">描述需求，自动调用或生成工具</span></span>
      <button id="chat-close" class="btn">✕</button>
    </div>
    <div id="chat-messages" class="chat-messages">
      <div class="chat-empty">你好，我是 Doc-Helper 智能体。<br>你可以说：<br>· 把几个 Excel 合并成一个<br>· 帮我做一个能把多个 word 合并的工具<br><br>（需先在右上角"设置"配置大模型 API Key）</div>
    </div>
    <div class="chat-input">
      <textarea id="chat-text" placeholder="描述你的文档处理需求…"></textarea>
      <button id="chat-send" class="btn primary">发送</button>
    </div>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
