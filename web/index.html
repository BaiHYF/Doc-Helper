<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文枢智汇 · 本地智能文档工作台</title>
  <style>
    :root {
      --bg-0: #04070d;
      --bg-1: #0a1322;
      --bg-2: #0d1728;
      --cyan: #22d3ee;
      --blue: #3b82f6;
      --violet: #8b5cf6;
      --line: rgba(139, 160, 190, .18);
      --line-strong: rgba(139, 160, 190, .34);
      --text: #e8eef7;
      --muted: #8fa3bd;
      --primary: #3b82f6;
      --primary-dark: #2f6fed;
      --green: #34d399;
      --red: #f87171;
      --amber: #fbbf24;
      --radius: 12px;
      --grad: linear-gradient(92deg, var(--cyan), var(--blue) 52%, var(--violet));
      --font-disp: "Bahnschrift", "Segoe UI", system-ui, sans-serif;
      --font-mono: "Cascadia Mono", Consolas, monospace;
    }
    * { box-sizing: border-box; }

    /* ---------- 背景层：网格 + 光晕（固定，不遮挡内容） ---------- */
    body::before {
      content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image:
        linear-gradient(rgba(34, 211, 238, .05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(34, 211, 238, .05) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse 100% 62% at 50% 0%, #000 20%, transparent 85%);
      -webkit-mask-image: radial-gradient(ellipse 100% 62% at 50% 0%, #000 20%, transparent 85%);
    }
    body::after {
      content: ""; position: fixed; z-index: 0; pointer-events: none;
      width: 560px; height: 420px; left: 50%; top: -240px; transform: translateX(-50%);
      background: radial-gradient(ellipse, rgba(34, 211, 238, .16), transparent 70%);
      filter: blur(60px);
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Microsoft YaHei", system-ui, sans-serif;
      background: var(--bg-0);
      color: var(--text);
    }
    :focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; border-radius: 4px; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: rgba(139, 160, 190, .28); border-radius: 6px; border: 2px solid var(--bg-0); }
    ::-webkit-scrollbar-track { background: transparent; }

    /* ---------- 顶栏 ---------- */
    header {
      position: sticky; top: 0; z-index: 5;
      display: flex; align-items: center; justify-content: space-between;
      padding: 13px 24px;
      background: rgba(4, 7, 13, .78);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }
    header::after {
      content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(34, 211, 238, .5), transparent);
    }
    header .brand {
      display: flex; align-items: center; gap: 10px;
      font-family: var(--font-disp); font-size: 17px; font-weight: 700; letter-spacing: .12em;
    }
    header .brand::before {
      content: ""; width: 12px; height: 12px; border-radius: 4px;
      background: var(--grad);
      box-shadow: 0 0 12px rgba(59, 130, 246, .7);
    }
    header .brand small {
      color: var(--muted); font-weight: 400; font-size: 12px; letter-spacing: .02em;
      font-family: "Microsoft YaHei", system-ui, sans-serif;
    }
    .header-actions { display: flex; align-items: center; gap: 8px; }

    /* ---------- 按钮 ---------- */
    .btn {
      display: inline-flex; align-items: center; gap: 7px;
      border: 1px solid var(--line-strong);
      background: rgba(13, 23, 40, .6);
      padding: 7px 14px;
      border-radius: 9px;
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
      color: var(--text);
      transition: border-color .18s ease, box-shadow .18s ease, transform .18s ease, background .18s ease;
    }
    .btn:hover { border-color: rgba(34, 211, 238, .65); box-shadow: 0 0 14px rgba(34, 211, 238, .16); background: rgba(13, 23, 40, .9); }
    .btn.primary {
      background: var(--grad); border-color: transparent;
      color: #04121a; font-weight: 600;
      box-shadow: 0 0 16px rgba(59, 130, 246, .38);
    }
    .btn.primary:hover { background: var(--grad); box-shadow: 0 0 26px rgba(34, 211, 238, .55); }
    .btn.danger { color: var(--red); }
    .btn.danger:hover { border-color: rgba(248, 113, 113, .6); box-shadow: 0 0 14px rgba(248, 113, 113, .2); }
    .btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
    .btn svg { width: 14px; height: 14px; }

    .container {
      position: relative; z-index: 1;
      max-width: 920px; margin: 0 auto; padding: 26px 20px 60px;
    }
    .hidden { display: none !important; }

    .container h2 {
      display: flex; align-items: center; gap: 10px;
      margin: 0 0 16px; font-size: 18px; letter-spacing: .04em;
    }
    .container h2::before {
      content: ""; width: 4px; height: 16px; border-radius: 2px;
      background: var(--grad); box-shadow: 0 0 8px rgba(34, 211, 238, .6);
    }
    .container h2:not(:first-child) { margin-top: 30px; }

    /* ---------- 工具 / 插件列表 ---------- */
    .tool-search-bar {
      position: relative;
      display: flex; align-items: center;
      margin-bottom: 12px;
    }
    .tool-search-bar .search-icon {
      position: absolute; left: 12px; width: 15px; height: 15px;
      color: var(--muted); pointer-events: none;
    }
    .tool-search {
      width: 100%;
      padding: 10px 14px 10px 36px;
      background: rgba(13, 23, 40, .72);
      color: var(--text);
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      font-size: 13px;
      font-family: inherit;
      transition: border-color .18s ease, box-shadow .18s ease;
    }
    .tool-search:focus { outline: none; border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(34, 211, 238, .14); }
    .tool-search::placeholder { color: rgba(143, 163, 189, .65); }
    .tool-cats { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .cat-chip {
      border: 1px solid var(--line-strong);
      background: rgba(13, 23, 40, .55);
      color: var(--muted);
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 12.5px;
      font-family: inherit;
      transition: all .18s ease;
      user-select: none;
    }
    .cat-chip:hover { border-color: rgba(34, 211, 238, .5); color: var(--text); }
    .cat-chip.active {
      background: var(--grad); border-color: transparent;
      color: #04121a; font-weight: 600;
      box-shadow: 0 0 12px rgba(59, 130, 246, .35);
    }
    .tool-card {
      position: relative; overflow: hidden;
      background: linear-gradient(180deg, rgba(12, 22, 40, .78), rgba(8, 14, 26, .78));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px 18px;
      margin-bottom: 14px;
      transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
    }
    .tool-card::before {
      content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(34, 211, 238, .6), transparent);
      opacity: 0; transition: opacity .25s ease;
    }
    .tool-card:hover { transform: translateY(-2px); border-color: rgba(34, 211, 238, .4); box-shadow: 0 10px 34px rgba(2, 8, 20, .55); }
    .tool-card:hover::before { opacity: 1; }
    .tool-card.draft { opacity: .68; }
    .tool-card.hidden-card { display: none; }
    .tool-card-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .tool-name { font-weight: 700; font-size: 15px; font-family: var(--font-disp); letter-spacing: .03em; }
    .tool-key { color: rgba(143, 163, 189, .55); font-size: 11.5px; font-family: var(--font-mono); letter-spacing: .03em; }
    .tool-cat-tags { display: flex; gap: 6px; flex-wrap: wrap; }
    .tag {
      font-size: 11px; padding: 2px 9px; border-radius: 20px;
      background: rgba(59, 130, 246, .12); color: #7db4ff;
      border: 1px solid rgba(59, 130, 246, .3);
    }
    .badge {
      font-size: 11px; padding: 2px 10px; border-radius: 20px;
      font-family: var(--font-mono); letter-spacing: .06em;
    }
    .badge.on { background: rgba(52, 211, 153, .12); color: var(--green); border: 1px solid rgba(52, 211, 153, .35); }
    .badge.off { background: rgba(251, 191, 36, .1); color: var(--amber); border: 1px solid rgba(251, 191, 36, .32); }
    .tool-desc { color: var(--muted); font-size: 13px; margin: 8px 0 12px; line-height: 1.65; }
    .tool-desc small { color: rgba(143, 163, 189, .6); }
    .tool-card-actions { display: flex; gap: 8px; }
    .empty { color: var(--muted); text-align: center; padding: 60px 0; font-size: 14px; }

    /* ---------- 调用页 ---------- */
    .back { margin-bottom: 16px; }
    .call-title { font-size: 21px; font-weight: 700; font-family: var(--font-disp); letter-spacing: .04em; }
    .call-desc { color: var(--muted); font-size: 13px; margin: 6px 0 18px; line-height: 1.7; }
    .call-tags {
      display: inline-block; margin-left: 8px; padding: 1px 9px; border-radius: 20px;
      font-size: 11px; color: #7db4ff; background: rgba(59, 130, 246, .12);
      border: 1px solid rgba(59, 130, 246, .3); vertical-align: middle;
    }
    .panel {
      background: linear-gradient(180deg, rgba(12, 22, 40, .7), rgba(8, 14, 26, .7));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 14px;
    }
    .param { margin-bottom: 16px; }
    .param label { font-weight: 600; font-size: 13px; display: block; }
    .param .req { color: var(--red); }
    .param .hint { color: var(--muted); font-size: 12px; margin: 3px 0 8px; }
    .drop-zone {
      border: 2px dashed rgba(34, 211, 238, .4);
      border-radius: var(--radius);
      padding: 24px 16px;
      text-align: center;
      cursor: pointer;
      color: var(--muted);
      background: rgba(34, 211, 238, .04);
      transition: border-color .18s ease, background .18s ease, box-shadow .18s ease;
      margin-bottom: 16px;
    }
    .drop-zone:hover { border-color: var(--cyan); background: rgba(34, 211, 238, .07); }
    .drop-zone.drag-over { border-color: var(--cyan); background: rgba(34, 211, 238, .1); box-shadow: 0 0 24px rgba(34, 211, 238, .22); }
    .drop-hint { font-size: 13px; }
    .drop-hint strong { color: var(--cyan); font-weight: 600; }
    .drop-count { font-size: 12px; color: var(--cyan); margin-top: 6px; }
    .drop-error { font-size: 12px; color: var(--red); margin-top: 6px; }
    .drop-list { margin-top: 12px; text-align: left; }
    .drop-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 10px; margin-bottom: 6px;
      background: rgba(13, 23, 40, .7); border: 1px solid var(--line); border-radius: 8px;
      font-size: 13px; color: var(--text);
    }
    .drop-item .fname { word-break: break-all; }
    .drop-item .frm { color: var(--red); cursor: pointer; margin-left: 10px; border: none; background: none; font-size: 15px; line-height: 1; padding: 2px 4px; border-radius: 4px; }
    .drop-item .frm:hover { background: rgba(248, 113, 113, .15); }
    .text-input, .file-input {
      width: 100%;
      padding: 8px 11px;
      background: var(--bg-2);
      color: var(--text);
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      font-size: 13px;
      font-family: inherit;
      transition: border-color .18s ease, box-shadow .18s ease;
    }
    .text-input:focus, .file-input:focus {
      outline: none; border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(34, 211, 238, .14);
    }
    .file-names { color: var(--cyan); font-size: 12px; margin-top: 4px; }
    .actions { display: flex; gap: 8px; align-items: center; }
    #run-progress {
      color: var(--cyan); font-size: 13px; margin-top: 10px;
      font-family: var(--font-mono);
    }
    .result-ok { color: var(--green); font-weight: 600; margin-bottom: 8px; }
    .result-err { color: var(--red); font-weight: 600; }
    .result-links { display: flex; gap: 10px; flex-wrap: wrap; }
    .download {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(59, 130, 246, .14);
      color: #7db4ff;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      border: 1px solid rgba(59, 130, 246, .35);
      transition: border-color .18s ease, box-shadow .18s ease, transform .18s ease;
    }
    .download:hover { border-color: rgba(34, 211, 238, .6); box-shadow: 0 0 14px rgba(34, 211, 238, .2); transform: translateY(-1px); }

    /* ---------- 侧边栏布局 ---------- */
    .layout { display: flex; align-items: stretch; position: relative; z-index: 1; }
    .sidebar {
      width: 232px; flex-shrink: 0;
      position: sticky; top: 0; height: 100vh;
      overflow-y: auto;
      padding: 18px 12px 44px;
      background: rgba(7, 12, 22, .72);
      border-right: 1px solid var(--line);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .main-area { flex: 1; min-width: 0; }
    .main-area .container { max-width: 1000px; margin: 0; padding: 26px 28px 60px; }

    .nav-group { margin-bottom: 6px; }
    .nav-title {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 10px; border-radius: 8px;
      font-size: 13px; font-weight: 700; letter-spacing: .05em;
      color: var(--text); cursor: pointer;
      transition: background .15s ease, color .15s ease;
      user-select: none;
    }
    .nav-title:hover { background: rgba(59, 130, 246, .12); }
    .nav-title .nav-count { color: var(--muted); font-weight: 400; font-size: 11.5px; font-family: var(--font-mono); }
    .nav-item {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      width: 100%; border: none; background: none;
      padding: 7px 10px 7px 26px; border-radius: 8px;
      color: var(--muted); font-size: 13px; font-family: inherit; cursor: pointer;
      transition: background .15s ease, color .15s ease;
      text-align: left;
    }
    .nav-item:hover { background: rgba(34, 211, 238, .08); color: var(--text); }
    .nav-item.active { background: var(--grad); color: #04121a; font-weight: 600; box-shadow: 0 0 12px rgba(59, 130, 246, .3); }
    .nav-item .nav-count { font-size: 11px; font-family: var(--font-mono); opacity: .78; }
    .nav-empty { padding: 4px 10px 4px 26px; font-size: 12px; color: rgba(143, 163, 189, .55); }
    .nav-sep { height: 1px; margin: 12px 8px; background: var(--line); }

    /* 工具卡片上的星标 */
    .star-btn {
      position: absolute; top: 12px; right: 12px;
      border: none; background: none; cursor: pointer;
      font-size: 19px; line-height: 1; padding: 2px 4px;
      color: rgba(143, 163, 189, .5);
      transition: color .15s ease, transform .15s ease;
      border-radius: 6px;
    }
    .star-btn:hover { color: var(--amber); transform: scale(1.18); }
    .star-btn.on { color: var(--amber); text-shadow: 0 0 12px rgba(251, 191, 36, .6); }
    .card-missing { opacity: .55; }
    .card-missing .btn { opacity: .5; pointer-events: none; }
    .badge.self { background: rgba(139, 92, 246, .14); color: #c4b5fd; border: 1px solid rgba(139, 92, 246, .4); }

    /* 视图标题 / 分类分组 */
    .view-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .view-head .view-sub { color: var(--muted); font-size: 12px; font-weight: 400; }
    .cat-group { margin-bottom: 26px; }
    .cat-group-title {
      display: flex; align-items: center; gap: 10px;
      margin: 0 0 12px; font-size: 15px; letter-spacing: .04em;
    }
    .cat-group-title::before {
      content: ""; width: 4px; height: 14px; border-radius: 2px;
      background: var(--grad); box-shadow: 0 0 8px rgba(34, 211, 238, .6);
    }
    .cat-group-title .count { color: var(--muted); font-size: 12px; font-family: var(--font-mono); font-weight: 400; }

    .banner {
      border: 1px dashed var(--line-strong);
      border-radius: var(--radius);
      padding: 36px 20px;
      text-align: center;
      color: var(--muted); font-size: 13.5px; line-height: 2;
      background: rgba(13, 23, 40, .4);
    }
    .banner .btn { margin-top: 12px; }

    /* 移动端：汉堡 + 抽屉侧边栏 */
    #sidebar-toggle { display: none; }
    @media (max-width: 720px) {
      #sidebar-toggle { display: inline-flex; }
      .sidebar {
        position: fixed; left: 0; top: 0; bottom: 0; z-index: 40;
        transform: translateX(-100%);
        transition: transform .22s ease;
        box-shadow: 8px 0 40px rgba(0, 0, 0, .5);
        background: rgba(5, 9, 16, .98);
        width: 264px;
      }
      .sidebar.open { transform: translateX(0); }
      .main-area .container { padding: 18px 14px 50px; }
    }

    /* ---------- 设置弹窗 ---------- */
    .modal-mask {
      position: fixed; inset: 0; z-index: 30;
      background: rgba(2, 5, 10, .66);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center;
    }
    .modal {
      position: relative;
      background: linear-gradient(180deg, rgba(13, 23, 40, .97), rgba(8, 14, 26, .97));
      border: 1px solid var(--line-strong);
      border-radius: 14px;
      padding: 24px;
      width: 440px;
      max-width: 92vw;
      box-shadow: 0 24px 70px rgba(0, 0, 0, .6), 0 0 40px rgba(34, 211, 238, .08);
    }
    .modal h3 { margin: 0 0 18px; font-size: 16px; letter-spacing: .05em; }
    .modal .field { margin-bottom: 14px; }
    .modal .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; letter-spacing: .04em; }
    .modal .text-input { width: 100%; }
    .modal .actions { justify-content: flex-end; margin-top: 18px; }
    .modal .hint { color: var(--muted); font-size: 12px; }

    /* ---------- 聊天侧边栏 ---------- */
    .chat-panel {
      position: fixed;
      top: 0; right: 0; bottom: 0;
      width: 390px;
      background: linear-gradient(180deg, rgba(7, 12, 22, .98), rgba(5, 9, 16, .98));
      border-left: 1px solid var(--line);
      display: flex; flex-direction: column;
      z-index: 20;
      transition: transform .22s ease;
      box-shadow: -8px 0 40px rgba(0, 0, 0, .5);
    }
    .chat-panel::before {
      content: ""; position: absolute; top: 0; left: 0; bottom: 0; width: 1px;
      background: linear-gradient(180deg, var(--cyan), var(--violet));
      opacity: .5;
    }
    .chat-panel.closed { transform: translateX(100%); }
    .chat-toggle { z-index: 21; }
    .chat-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 15px 16px;
      border-bottom: 1px solid var(--line);
      font-weight: 700; font-size: 15px;
    }
    .chat-header .sub { color: var(--muted); font-weight: 400; font-size: 12px; }
    .chat-messages {
      flex: 1; overflow-y: auto;
      padding: 14px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .chat-msg {
      max-width: 88%;
      padding: 9px 13px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.65;
      white-space: pre-wrap; word-break: break-word;
    }
    .chat-msg.user {
      align-self: flex-end;
      background: var(--grad); color: #04121a; font-weight: 500;
      box-shadow: 0 0 16px rgba(59, 130, 246, .3);
    }
    .chat-msg.assistant {
      align-self: flex-start;
      background: rgba(13, 23, 40, .85);
      border: 1px solid var(--line);
      color: var(--text);
    }
    .chat-tool {
      margin-top: 6px; padding: 6px 10px;
      background: rgba(34, 211, 238, .09); border: 1px solid rgba(34, 211, 238, .3);
      border-radius: 8px;
      font-size: 12px; color: #7dd7e8;
    }
    .chat-tool.err { background: rgba(248, 113, 113, .09); border-color: rgba(248, 113, 113, .35); color: var(--red); }
    .chat-draft {
      margin-top: 8px; padding: 10px 12px;
      border: 1px dashed rgba(34, 211, 238, .55); border-radius: 10px;
      background: rgba(34, 211, 238, .05);
    }
    .chat-draft-title { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .chat-draft-name { font-weight: 700; font-size: 14px; }
    .chat-draft-desc { font-size: 12px; color: var(--muted); margin: 4px 0 8px; line-height: 1.6; }
    .chat-input {
      display: flex; gap: 8px; align-items: flex-end;
      padding: 12px;
      border-top: 1px solid var(--line);
    }
    .chat-input textarea {
      flex: 1; resize: none;
      background: var(--bg-2);
      color: var(--text);
      border: 1px solid var(--line-strong); border-radius: 10px;
      padding: 9px 11px; font-size: 13px; font-family: inherit;
      min-height: 40px; max-height: 120px;
      transition: border-color .18s ease, box-shadow .18s ease;
    }
    .chat-input textarea:focus { outline: none; border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(34, 211, 238, .14); }
    .chat-empty { color: var(--muted); font-size: 12px; text-align: center; margin-top: 40px; line-height: 1.9; }

    @media (max-width: 720px) {
      .chat-panel { width: 100vw; }
      header { padding: 12px 16px; }
      .container { padding: 20px 14px 50px; }
      header .brand small { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <header>
    <button id="sidebar-toggle" class="btn" title="菜单">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div class="brand">文枢智汇 <small>本地文档处理助手</small></div>
    <div class="header-actions">
      <button id="chat-toggle" class="btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
        智能体
      </button>
      <button id="settings-btn" class="btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        设置
      </button>
    </div>
  </header>

  <div class="layout">
    <!-- 主导航侧边栏（sidebar.js 渲染） -->
    <aside id="sidebar" class="sidebar" aria-label="主导航"></aside>

    <div class="main-area">
      <div class="container">
        <!-- 视图区：工具列表 / 共享平台 / 个人工具库 -->
        <div id="view-root">
          <section id="view-tools">
            <h2>工具列表</h2>
            <div class="tool-search-bar">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="search-icon"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
              <input id="tool-search" class="tool-search" type="text" placeholder="搜索工具名称或用途，如：合并、清洗…" autocomplete="off">
            </div>
            <div id="tool-list"></div>
            <h2>插件</h2>
            <div id="plugin-list"></div>
          </section>
          <section id="view-shared" class="hidden"></section>
          <section id="view-personal" class="hidden"></section>
        </div>

        <!-- 工具调用界面 -->
        <div id="call-view" class="hidden">
          <button id="call-back" class="btn back">← 返回</button>
          <div class="call-title" id="call-title"></div>
          <div class="call-desc" id="call-desc"></div>
          <div class="panel">
            <div id="param-fields"></div>
            <div class="actions">
              <button id="run-btn" class="btn primary" disabled>开始运行</button>
              <button id="cancel-btn" class="btn danger hidden">取消</button>
            </div>
          </div>
          <div id="run-progress" class="hidden"></div>
          <div id="run-result" class="panel hidden"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 设置弹窗 -->
  <div id="settings-modal" class="modal-mask hidden">
    <div class="modal">
      <h3>大模型设置</h3>
      <div class="field"><label>厂商</label><input id="set-vendor" class="text-input" placeholder="deepseek"></div>
      <div class="field"><label>Base URL</label><input id="set-base" class="text-input" placeholder="https://api.deepseek.com"></div>
      <div class="field"><label>模型名</label><input id="set-model" class="text-input" placeholder="deepseek-chat"></div>
      <div class="field"><label>API Key</label><input id="set-key" class="text-input" type="password" placeholder="sk-...">
        <div id="set-key-hint" class="hint" style="margin-top:4px;"></div>
      </div>
      <div class="actions">
        <button id="settings-close" class="btn">取消</button>
        <button id="settings-save" class="btn primary">保存</button>
      </div>
    </div>
  </div>

  <!-- 聊天侧边栏（默认收起，点顶栏"智能体"展开） -->
  <div id="chat-panel" class="chat-panel closed">
    <div class="chat-header">
      <span>智能体助手 <span class="sub">描述需求，自动调用或生成工具</span></span>
      <button id="chat-close" class="btn">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div id="chat-messages" class="chat-messages">
      <div class="chat-empty">你好，我是文枢智汇智能体。<br>你可以说：<br>· 把几个 Excel 合并成一个<br>· 帮我做一个能把多个 word 合并的工具<br><br>（需先在右上角"设置"配置大模型 API Key）</div>
    </div>
    <div class="chat-input">
      <textarea id="chat-text" placeholder="描述你的文档处理需求…"></textarea>
      <button id="chat-send" class="btn primary">发送</button>
    </div>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
